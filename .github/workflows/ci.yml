name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pulsesearch
          POSTGRES_PASSWORD: pulsesearch
          POSTGRES_DB: pulsesearch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pulsesearch"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pulsesearch:pulsesearch@localhost:5432/pulsesearch_test
      REDIS_URL: redis://localhost:6379/1
      JWT_SECRET: ci-test-secret
      UPLOAD_DIR: ./test_uploads

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Run tests
        run: pytest -v

      - name: Build Docker image
        working-directory: .
        run: docker build -t pulsesearch-backend ./backend

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        # npm ci is stricter but the lockfile's optional platform-specific packages
        # (lightningcss/@napi-rs native bindings) don't always cover every CI/build
        # platform consistently, so npm install is used here and in the Dockerfile.
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
